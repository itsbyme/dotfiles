################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitorv2 {
	output = DP-2
	mode = 1920x1080@75
	position = 0x0
	scale = 1
	transform = 1
}
monitorv2 {
	output = HDMI-A-1
	mode = 1920x1080@75
	position = 1080x840
	scale = 1
}
monitorv2 {
	output = DP-1
	mode = 2560x1440@165
	position = 3000x480
	scale = 1
	bitdepth = 10
}

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = kitty
$fileManager = $terminal mc
$menu = wofi --show drun
$screenshot = bash -c "grim -g '$(slurp)' - | tee ~/Pictures/Screenshots/area_$(date +'%Y%m%d_%H%M%S').png | wl-copy --type image/png"
$monitoring = $terminal btop

