###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER 
$slaveMod = SHIFT 

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, R,      exec, $menu
bind = $mainMod, S,      exec, $screenshot
bind = $mainMod, B,      exec, $monitoring

bind = $mainMod,           Q, killactive,
bind = $mainMod,           F, fullscreen
bind = $mainMod $slaveMod, P, pseudo, # dwindle
bind = $mainMod $slaveMod, V, togglefloating,
bind = $mainMod $slaveMod, X, exit,
bind = $mainMod $slaveMod, R, exec, hyprctl reload 

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, r~1
bind = $mainMod, 2, workspace, r~2
bind = $mainMod, 3, workspace, r~3
bind = $mainMod, 4, workspace, r~4
bind = $mainMod, 5, workspace, r~5
bind = $mainMod, 6, workspace, r~6
bind = $mainMod, 7, workspace, r~7
bind = $mainMod, 8, workspace, r~8
bind = $mainMod, 9, workspace, r~9
bind = $mainMod, 0, workspace, r~10

# Move active window to a workspace with mainMod + slaveMod + [0-9]
bind = $mainMod $slaveMod, 1, movetoworkspacesilent, r~1
bind = $mainMod $slaveMod, 2, movetoworkspacesilent, r~2
bind = $mainMod $slaveMod, 3, movetoworkspacesilent, r~3
bind = $mainMod $slaveMod, 4, movetoworkspacesilent, r~4
bind = $mainMod $slaveMod, 5, movetoworkspacesilent, r~5
bind = $mainMod $slaveMod, 6, movetoworkspacesilent, r~6
bind = $mainMod $slaveMod, 7, movetoworkspacesilent, r~7
bind = $mainMod $slaveMod, 8, movetoworkspacesilent, r~8
bind = $mainMod $slaveMod, 9, movetoworkspacesilent, r~9
bind = $mainMod $slaveMod, 0, movetoworkspacesilent, r~10

# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod $slaveMod, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Sound Management
bindel = $mainMod, F8, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 3%+
bindel = $mainMod, F7, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 3%-
bindel = $mainMod, F6, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = $mainMod, F5, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Player Management
bind = $mainMod, F9,  exec, playerctl previous
bind = $mainMod, F10, exec, playerctl next
bind = $mainMod, F11, exec, playerctl play-pause

